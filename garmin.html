function nvGuideT(pt,T,W){var k=111320*Math.cos(pt.la*Math.PI/180),best=1e12,bp=null,bs=0,bi=1;
 for(var i=1;i<T.sh.length;i++){var a=T.sh[i-1],b=T.sh[i],ax=(a[1]-pt.lo)*k,ay=(a[0]-pt.la)*110540,bx=(b[1]-pt.lo)*k,by=(b[0]-pt.la)*110540,dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy,u=l?Math.max(0,Math.min(1,-(ax*dx+ay*dy)/l)):0,x=ax+u*dx,y=ay+u*dy,dd=Math.hypot(x,y);
  if(dd<best){best=dd;bi=i;bp={la:pt.la+y/110540,lo:pt.lo+x/k};bs=T.shc[i-1]+u*(T.shc[i]-T.shc[i-1])}}
 if(!bp)return;
 var act=(T===NV.rt)||(!NV.tgt&&T===NV.shO);if(act&&best<25)NV.snap=[bp.la,bp.lo];
 if(T.lineRem&&best<60){var cut=[bp.la,bp.lo],rem=[cut].concat(T.sh.slice(bi)),pas=T.sh.slice(0,bi).concat([cut]);T.lineRem.setLatLngs(rem);T.lineRemH&&T.lineRemH.setLatLngs(rem);T.linePass&&T.linePass.setLatLngs(pas)}var el=document.getElementById('nvSt'),bx=document.getElementById('nvTurn'),left=T.shT-bs;
 var mute=NV.ms||(NV.tgt&&T!==NV.rt),pre=(T===NV.rt?'r':'s');function say(k,t){if(!mute)nvSay1(pre+k,t)}
 function show(cls,ic,big,line,small){if(NV.ms||(NV.tgt&&T!==NV.rt))return;bx.className='nvturn on '+cls;document.getElementById('nvTa').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">'+NV_AR[ic]+'</svg>';document.getElementById('nvTd').textContent=big;document.getElementById('nvTt').textContent=line;document.getElementById('nvTr').textContent=small}
 if(best>(T===NV.rt?60:40)){say('off'+Math.floor(Date.now()/60000),'ارجع لل'+W.slice(2));if(T===NV.rt&&best>150)nvRoute(true);var dn=dname(gpsBrg(pt,bp));show('off','back',nvFmt(best),'ارجع لل'+W.slice(2)+'، اتجه '+dn,'طول '+W+' '+nvFmt(T.shT));if(T!==NV.rt)el.textContent='↩︎ '+W+' تبعد '+nvFmt(best)+' '+dn;return}
 if(left<30){say('fin',T===NV.rt?'وصلت':'وصلت نهاية الجرة');show('fin','fin','وصلت',T===NV.rt?NV.tgt.n+' 🏁':'نهاية الجرة 🏁','');if(T!==NV.rt)el.textContent='🏁 وصلت نهاية الجرة';return}
 var nt=null;for(var j=0;j<T.turns.length;j++){if(T.turns[j].s>bs+8){nt=T.turns[j];break}}
 if(!nt){if(left>300)say('st'+Math.round(left/1000),'كمّل سيدا '+nvSpk(left));show('','st',nvFmt(left),T===NV.rt?'كمّل سيدا لين '+NV.tgt.n:'كمّل سيدا لين نهاية الجرة','');if(T!==NV.rt)el.textContent='✅ أنت على الجرة · باقي '+nvFmt(left);return}
 var dd2=nt.s-bs,side=nt.r?'يمين':'يسار',ic=nt.t==='u'?(nt.r?'ur':'ul'):nt.t==='s'?(nt.r?'sr':'sl'):(nt.r?'r':'l'),
  act=nt.t==='u'?'لف ورا ('+side+')':nt.t==='s'?'خفّف '+side:'لف '+side;
 var spd=(NV.co&&NV.co.speed)||0,far=spd>14?800:spd>7?400:250,tid=Math.round(nt.s);if(dd2<=far&&dd2>90)say('f'+tid,'بعد '+nvSpk(dd2)+'، '+act);if(dd2<=60)say('n'+tid,'الحين، '+act);
 show('',ic,dd2<30?'الحين':nvFmt(dd2),dd2<30?act:'بعدها '+act,'باقي '+nvFmt(left)+(T===NV.rt?' لين '+NV.tgt.n:' لين نهاية الجرة'));
 if(T!==NV.rt)el.textContent='✅ أنت على الجرة · باقي '+nvFmt(left)}
/* وش حولك: معالم بالأسماء من خريطة OpenStreetMap */
var NV_OV=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter'];
function nvCat(t){if(t.natural==='peak'||t.natural==='hill'||t.natural==='ridge'||t.natural==='saddle'||t.natural==='cliff')return 'peak';
 if(t.waterway||t.natural==='valley')return 'wadi';if(t.man_made==='water_well'||t.natural==='spring'||t.natural==='water'||t.amenity==='drinking_water')return 'water';
 if(t.place)return 'place';if(t.natural==='dune'||t.natural==='sand')return 'sand';return 'other'}
/* أسماء البر (GeoNames): جبال وشعبان وقيعان وآبار وقرى، مقسّمة بمربعات درجة */
NVC.qa=NVC.qa||['🟫','#9b7b4f','قاع / روضة / سبخة'];var NVP={};
function nvCell(k){if(!NVP[k])NVP[k]=fetch('/data/names/'+k+'.json').then(function(r){return r.ok?r.json():[]}).catch(function(){return []});return NVP[k]}
function nvCells(s,w,n,e){var ks=[];for(var a=Math.floor(s);a<=Math.floor(n);a++)for(var o=Math.floor(w);o<=Math.floor(e);o++)ks.push(a+'_'+o);return Promise.all(ks.slice(0,9).map(nvCell)).then(function(r){return [].concat.apply([],r)})}
function nvLabels(){if(!NV.map)return;var m=NV.map,z=m.getZoom();if(!NV.lbl)NV.lbl=L.layerGroup().addTo(m);
 if(z<11){NV.lbl.clearLayers();NV._lb=null;return}var vb=m.getBounds();if(NV._lb&&NV._lz===z&&NV._lcat===NV.cat&&NV._lb.contains(vb))return;var b=vb.pad(0.6),tk=NV._lt=(NV._lt||0)+1;NV._lb=b;NV._lz=z;NV._lcat=NV.cat;
 nvCells(b.getSouth(),b.getWest(),b.getNorth(),b.getEast()).then(function(all){if(tk!==NV._lt)return;var c=m.getCenter(),cap=(NV.tgt||NV.sh)?140:(z>=14?400:z>=13?300:z>=12?220:150);
  var arr=all.filter(function(x){return b.contains([x[0],x[1]])&&(NV.cat==='all'||NV.cat===x[3])});
  arr.sort(function(p,q){return (Math.abs(p[0]-c.lat)+Math.abs(p[1]-c.lng))-(Math.abs(q[0]-c.lat)+Math.abs(q[1]-c.lng))});
  NV.lbl.clearLayers();arr.slice(0,cap).forEach(function(x){L.marker([x[0],x[1]],{keyboard:false,icon:L.divIcon({className:'nvnm',html:'<span class="c-'+x[3]+'">'+esc(x[2])+'</span>',iconSize:[0,0]})}).on('click',function(){nvTarget(x[0],x[1],x[2],x[3])}).addTo(NV.lbl)})})}
function nvAround(pt){NV.q={la:pt.la,lo:pt.lo};var r=15000,a='(around:'+r+','+pt.la.toFixed(4)+','+pt.lo.toFixed(4)+')';
 var q='[out:json][timeout:25];(node'+a+'["natural"~"^(peak|hill|saddle|spring|dune)$"]["name"];way'+a+'["natural"~"^(ridge|valley|cliff|water|sand|dune)$"]["name"];way'+a+'["waterway"~"^(wadi|stream|river|canal|drain)$"]["name"];node'+a+'["man_made"="water_well"];node'+a+'["place"~"^(town|village|hamlet|isolated_dwelling|locality|farm)$"]["name"];);out tags geom(qt) 400;';
 document.getElementById('nvCnt').textContent='ندوّر وش حولك…';
 NV.gn=[];nvCells(pt.la-.15,pt.lo-.15,pt.la+.15,pt.lo+.15).then(function(all){NV.gn=all.filter(function(x){return gpsHav(pt,{la:x[0],lo:x[1]})<=r}).map(function(x){return {k:x[3],n:x[2],pts:[[x[0],x[1]]],lines:[],sub:'',gn:1}});nvParse(NV.ovEls||[])});
 (function tryN(i){if(i>=NV_OV.length){NV.ovEls=[];nvParse([]);return}
  fetch(NV_OV[i],{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'}}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){NV.ovEls=j.elements||[];nvParse(NV.ovEls)}).catch(function(){tryN(i+1)})})(0)}
function nvParse(els){var seen={},out=[];els.forEach(function(e){var t=e.tags||{},nm=t['name:ar']||t.name||(t.man_made==='water_well'?'بئر':'');if(!nm)return;var k=nvCat(t),pts=[];
  if(e.type==='node')pts=[[e.lat,e.lon]];else if(e.geometry)pts=e.geometry.map(function(g){return [g.lat,g.lon]});if(!pts.length)return;
  var key=k+'|'+nm;if(seen[key]&&k==='wadi'){seen[key].pts=seen[key].pts.concat(pts);seen[key].lines.push(pts);return}
  if(seen[key]&&k!=='water')return;var it={k:k,n:nm,pts:pts,lines:e.type==='way'?[pts]:[],sub:t.ele?'ارتفاعه '+A(Math.round(+t.ele))+' م':''};seen[key]=it;out.push(it)});
 (NV.gn||[]).forEach(function(it){var key=it.k+'|'+it.n;if(!seen[key]){seen[key]=it;out.push(it)}});
 NV.items=out;nvDraw();nvList()}
function nvNear(it){var me={la:NV.co.latitude,lo:NV.co.longitude},best=1e12,bp=it.pts[0];it.pts.forEach(function(p){var d=gpsHav(me,{la:p[0],lo:p[1]});if(d<best){best=d;bp=p}});it.d=best;it.b=gpsBrg(me,{la:bp[0],lo:bp[1]});it.bp=bp}
function nvDraw(){if(!NV.map)return;NV.grp.clearLayers();NV.items.forEach(function(it){if(NV.cat!=='all'&&it.k!==NV.cat)return;var c=NVC[it.k];
  it.lines.forEach(function(ln){if(ln.length>1)L.polyline(ln,{color:c[1],weight:it.k==='wadi'?4:2,opacity:.85}).addTo(NV.grp)});
  if(!NV.co||it.gn)return;nvNear(it);var mk=L.marker(it.bp,{icon:L.divIcon({className:'',html:'<div class="nvpin" style="background:'+c[1]+'">'+c[0]+'</div>',iconSize:[22,22],iconAnchor:[11,11]})}).addTo(NV.grp);
  mk.on('click',function(){nvTarget(it.bp[0],it.bp[1],it.n,it.k)});mk.bindTooltip(esc(it.n),{permanent:it.k!=='water',direction:'top',offset:[0,-10],className:'nvlbl'});it.mk=mk})}
function nvList(){if(!NV.co)return;var ls=document.getElementById('nvLs');NV.items.forEach(nvNear);
 var arr=NV.items.filter(function(it){return NV.cat==='all'||it.k===NV.cat}).sort(function(a,b){return a.d-b.d}).slice(0,80);
 document.getElementById('nvCnt').textContent=NV.items.length?A(NV.items.length)+' معلم بحدود ١٥ كم':'ما لقينا معالم بأسماء حولك';
 ls.innerHTML=arr.map(function(it,i){var c=NVC[it.k],d=it.d<1000?A(Math.round(it.d/10)*10)+' م':A((it.d/1000).toFixed(1)).replace('.','٫')+' كم';
  return '<div class="nvit" onclick="nvGo('+NV.items.indexOf(it)+')"><div class="e" style="background:'+c[1]+'33">'+c[0]+'</div><div class="t"><b>'+esc(it.n)+'</b><small>'+c[2]+(it.sub?' · '+it.sub:'')+'</small></div><div class="d">'+d+'<br><small style="color:var(--mut);font-weight:500">'+dname(it.b)+'</small></div></div>'}).join('')}
function nvGo(i){var it=NV.items[i];if(!it||!NV.map)return;nvTarget(it.bp[0],it.bp[1],it.n,it.k)}
function nvChips(){var cs=[['all','الكل'],['peak','⛰️ جبال'],['wadi','〰️ أودية وشعبان'],['water','💧 مويه'],['place','🏘️ قرى'],['sand','🏜️ نفود'],['qa','🟫 قيعان وروضات']];
 document.getElementById('nvCh').innerHTML=cs.map(function(c){return '<button data-c="'+c[0]+'" class="'+(c[0]===NV.cat?'on':'')+'" onclick="nvSetCat(\''+c[0]+'\')">'+c[1]+'</button>'}).join('')}
function nvSetCat(k){NV.cat=k;nvChips();nvDraw();nvList();NV._lb=null;nvLabels()}
nvOpen();
