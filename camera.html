<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>وسمي — كاشف الفقع</title>
<meta name="theme-color" content="#2E1C12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root { --sand:#FAF3E6; --honey:#C98F3E; --clay:#A5552E; --earth:#5A331C; --ink:#2E1C12; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--sand); font-family: "IBM Plex Sans Arabic", Tahoma, sans-serif; }
video, canvas { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
canvas { pointer-events: none; }
.bar {
  position: fixed; top: 0; inset-inline: 0; z-index: 2;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 18px 14px;
  display: flex; justify-content: space-between; align-items: center;
  background: linear-gradient(to bottom, rgba(46,28,18,.85), rgba(46,28,18,0));
}
.bar a { color: var(--sand); text-decoration: none; font-weight: 600; }
.word { font-family: "Reem Kufi", sans-serif; font-size: 26px; }
.panel {
  position: fixed; bottom: 0; inset-inline: 0; z-index: 2;
  padding: 18px 20px calc(env(safe-area-inset-bottom, 0px) + 22px);
  background: linear-gradient(to top, rgba(46,28,18,.92), rgba(46,28,18,0));
  text-align: center;
}
.meter { height: 8px; border-radius: 9px; background: rgba(250,243,230,.18); overflow: hidden; max-width: 420px; margin: 0 auto 12px; }
.meter i { display: block; height: 100%; width: 0; background: var(--honey); transition: width .2s; }
#status { font-size: 17px; font-weight: 600; margin: 0 0 6px; }
#hint { font-size: 14px; margin: 0 auto; max-width: 42ch; line-height: 1.7; opacity: .85; }
.start {
  margin-top: 14px; border: 0; border-radius: 14px; padding: 14px 26px;
  background: var(--honey); color: var(--ink); font: 600 17px/1 inherit; font-family: inherit; cursor: pointer;
}
.start:focus-visible { outline: 3px solid var(--sand); outline-offset: 2px; }
.guide[hidden], .start[hidden], .zoom[hidden] { display: none; }
.zoom { position: fixed; z-index: 3; inset-inline-end: 16px; top: calc(env(safe-area-inset-top, 0px) + 64px); min-width: 56px; min-height: 44px; border-radius: 999px; border: 1.5px solid var(--sand); background: rgba(46,28,18,.55); color: var(--sand); font: 600 16px 'IBM Plex Sans Arabic', sans-serif; cursor: pointer; }
.zoom[aria-pressed="true"] { background: var(--honey); color: var(--ink); border-color: var(--honey); }
.trackbtn { position: fixed; z-index: 3; inset-inline-end: 16px; top: calc(env(safe-area-inset-top, 0px) + 118px); min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--sand); background: rgba(46,28,18,.55); color: var(--sand); font: 600 15px 'IBM Plex Sans Arabic', sans-serif; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.trackbtn[hidden], .sheet[hidden] { display: none; }
.sheet { position: fixed; inset: 0; z-index: 10; background: var(--ink); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.sheet header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; }
.sheet header strong { font-size: 18px; }
.sheet header button, .sheet .row button { min-height: 44px; padding: 0 16px; border-radius: 12px; border: 0; font: 600 15px 'IBM Plex Sans Arabic', sans-serif; cursor: pointer; }
.sheet header button { background: var(--sand); color: var(--ink); }
#trackmap { flex: 1; min-height: 0; background: #3b2a1f; }
.sheet .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px calc(env(safe-area-inset-bottom, 0px) + 14px); }
.sheet .stats { display: flex; gap: 18px; font-size: 14px; }
.sheet .stats b { display: block; font-family: 'Reem Kufi', sans-serif; font-size: 22px; color: var(--honey); }
.sheet .row button { background: transparent; color: var(--sand); border: 1.5px solid rgba(250,243,230,.4); }
#tracknote { padding: 0 16px 6px; font-size: 13px; opacity: .8; min-height: 1em; }
#cam, #overlay { transform-origin: 50% 50%; transition: transform .2s; }
.guide { list-style: none; margin: 12px auto 0; padding: 0; max-width: 360px; text-align: right; display: grid; gap: 8px; }
.guide li { display: flex; gap: 10px; align-items: flex-start; background: rgba(250,243,230,.08); border-radius: 12px; padding: 10px 12px; font-size: 15px; line-height: 1.6; }
.guide .ic { display: inline-flex; vertical-align: middle; padding: 3px 6px; margin-left: 4px; border-radius: 8px; background: rgba(250,243,230,.16); color: var(--sand); font-style: normal; }
.guide b { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--honey); color: var(--ink); display: grid; place-items: center; font-size: 13px; }
</style>
</head>
<body>
<video id="cam" playsinline muted></video>
<canvas id="overlay"></canvas>
<button class="zoom" id="zoom" type="button" aria-pressed="false" hidden>2x</button>
<button class="trackbtn" id="trackbtn" type="button" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>مساري</button>
<div class="sheet" id="sheet" hidden role="dialog" aria-label="المكان اللي مشيته">
  <header><strong>المكان اللي مشيته</strong><button type="button" id="sheetclose">رجوع للكاشف</button></header>
  <div id="trackmap"></div>
  <p id="tracknote"></p>
  <div class="row">
    <div class="stats"><span><b id="tdist">0</b>متر مشيته</span><span><b id="tarea">0</b>م² فحصتها</span><span><b id="tmarks">0</b>علامات</span></div>
    <button type="button" id="trackclear">مسح المسار</button>
  </div>
</div>

<header class="bar">
  <a href="w-r8m2x.html">رجوع للخريطة</a>
  <span class="word">وسمي</span>
</header>

<section class="panel" aria-live="polite">
  <div class="meter" aria-hidden="true"><i id="level"></i></div>
  <p id="status">كاشف الفقع</p>
  <p id="hint">امشِ بهدوء ووجّه الكاميرا للأرض. الكاشف يحلل الصورة بشكل مباشر، ويصفّر لما يشك بفقعة، ويسرّع الصفير كل ما قربت.</p>
  <ol class="guide" id="guide" hidden></ol>
  <button class="start" id="start" type="button">شغّل الكاشف</button>
</section>

<script>
// Detector: loads ./model/truffle.onnx (YOLO, single class) with onnxruntime-web when available.
window.WASMI_DETECT = null;
const MODEL = { session: null, size: 320, busy: false, last: [], history: [] };
async function loadDetector() {
  try {
    const meta = await fetch('model/meta.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null);
    if (!meta) return false;
    MODEL.size = meta.imgsz || 320;
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js';
      s.onload = res; s.onerror = rej; document.head.appendChild(s);
    });
    ort.env.wasm.numThreads = 1;
    ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/';
    MODEL.session = await ort.InferenceSession.create('model/truffle.onnx', { executionProviders: ['wasm'] });
    const off = document.createElement('canvas');
    off.width = off.height = MODEL.size;
    const octx = off.getContext('2d', { willReadFrequently: true });
    const iou = (a, b) => { const x1 = Math.max(a.x, b.x), y1 = Math.max(a.y, b.y), x2 = Math.min(a.x + a.w, b.x + b.w), y2 = Math.min(a.y + a.h, b.y + b.h); const inter = Math.max(0, x2 - x1) * Math.max(0, y2 - y1); return inter / (a.w * a.h + b.w * b.h - inter); };
    function regions(vw, vh) {
      if (MODEL.zoom) return [{ x: vw * 0.25, y: vh * 0.25, w: vw * 0.5, h: vh * 0.5 }];
      const tw = vw * 0.6, th = vh * 0.6;
      return [
        { x: 0, y: 0, w: tw, h: th }, { x: vw - tw, y: 0, w: tw, h: th },
        { x: 0, y: vh - th, w: tw, h: th }, { x: vw - tw, y: vh - th, w: tw, h: th },
        { x: 0, y: 0, w: vw, h: vh }
      ];
    }
    MODEL.step = 0; MODEL.recent = []; MODEL.zoom = false;
    window.WASMI_DETECT = async (vid) => {
      if (MODEL.busy || !vid.videoWidth) return MODEL.last;
      MODEL.busy = true;
      try {
        const S = MODEL.size, vw = vid.videoWidth, vh = vid.videoHeight;
        const regs = regions(vw, vh);
        const R = regs[MODEL.step % regs.length]; MODEL.step++;
        const scale = Math.min(S / R.w, S / R.h), dw = R.w * scale, dh = R.h * scale, px = (S - dw) / 2, py = (S - dh) / 2;
        octx.fillStyle = '#727272'; octx.fillRect(0, 0, S, S);
        octx.drawImage(vid, R.x, R.y, R.w, R.h, px, py, dw, dh);
        const px8 = octx.getImageData(0, 0, S, S).data;
        const input = new Float32Array(3 * S * S);
        for (let i = 0, p = 0; i < S * S; i++, p += 4) {
          input[i] = px8[p] / 255; input[S * S + i] = px8[p + 1] / 255; input[2 * S * S + i] = px8[p + 2] / 255;
        }
        const feeds = {}; feeds[MODEL.session.inputNames[0]] = new ort.Tensor('float32', input, [1, 3, S, S]);
        const out = (await MODEL.session.run(feeds))[MODEL.session.outputNames[0]];
        const d = out.data, n = out.dims[2];
        const now = performance.now();
        for (let i = 0; i < n; i++) {
          const sc = d[4 * n + i];
          if (sc < 0.3) continue;
          const cx = d[i], cy = d[n + i], w = d[2 * n + i], h = d[3 * n + i];
          const b = { x: R.x + (cx - w / 2 - px) / scale, y: R.y + (cy - h / 2 - py) / scale, w: w / scale, h: h / scale, score: sc, t: now };
          const seenBefore = MODEL.recent.some(r => now - r.t < 3000 && now - r.t > 50 && iou(r, b) > 0.25);
          b.confirmed = seenBefore;
          MODEL.recent.push(b);
        }
        MODEL.recent = MODEL.recent.filter(r => now - r.t < 3000);
        const live = MODEL.recent.filter(r => now - r.t < 1800).sort((a, b) => b.score - a.score);
        const keep = [];
        for (const b of live) { if (keep.every(k => iou(k, b) < 0.4)) keep.push(b); if (keep.length >= 5) break; }
        MODEL.last = keep.map(b => ({ x: b.x, y: b.y, w: b.w, h: b.h, score: b.score * (b.confirmed ? 1 : 0.6) }));
      } catch (e) { MODEL.last = []; }
      MODEL.busy = false;
      return MODEL.last;
    };
    return true;
  } catch (e) { return false; }
}
const detectorReady = loadDetector();

const video = document.getElementById('cam');
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const hintEl = document.getElementById('hint');
const levelEl = document.getElementById('level');

let audio = null, lastBeep = 0;
function beep(confidence) {
  if (!audio) return;
  const now = performance.now();
  const gap = 900 - 750 * confidence; // faster beeps when more confident
  if (now - lastBeep < gap) return;
  lastBeep = now;
  const o = audio.createOscillator(), g = audio.createGain();
  o.frequency.value = 600 + 600 * confidence;
  g.gain.setValueAtTime(0.0001, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.3, audio.currentTime + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.12);
  o.connect(g).connect(audio.destination);
  o.start(); o.stop(audio.currentTime + 0.13);
  if (navigator.vibrate) navigator.vibrate(confidence > 0.75 ? 120 : 40);
}

function draw(boxes) {
  canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const sx = canvas.width / (video.videoWidth || 1), sy = canvas.height / (video.videoHeight || 1);
  const s = Math.max(sx, sy);
  const ox = (canvas.width - video.videoWidth * s) / 2, oy = (canvas.height - video.videoHeight * s) / 2;
  for (const b of boxes) {
    ctx.strokeStyle = b.score > 0.75 ? '#A5552E' : '#C98F3E';
    ctx.lineWidth = 4;
    ctx.strokeRect(ox + b.x * s, oy + b.y * s, b.w * s, b.h * s);
  }
}

async function loop() {
  if (window.WASMI_DETECT) {
    const boxes = (await window.WASMI_DETECT(video)).filter(b => b.score >= 0.3);
    const best = boxes.reduce((m, b) => Math.max(m, b.score), 0);
    levelEl.style.width = Math.round(best * 100) + '%';
    draw(boxes);
    if (best >= 0.3) {
      beep(best);
      if (best > 0.75) markSign();
      statusEl.textContent = best > 0.75 ? 'فيه علامة فقعة قدامك' : 'يشك بشي… قرّب شوي';
    } else {
      statusEl.textContent = 'يدوّر…';
    }
  }
  requestAnimationFrame(loop);
}

const startBtn = document.getElementById('start');
const guideEl = document.getElementById('guide');

function device() {
  const ua = navigator.userAgent;
  const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const android = /Android/.test(ua);
  const inApp = /Instagram|FBAN|FBAV|Snapchat|Twitter|TikTok|musical_ly|Line\//i.test(ua);
  const chrome = /CriOS|Chrome/.test(ua) && !/Edg|SamsungBrowser|OPR/.test(ua);
  const samsung = /SamsungBrowser/.test(ua);
  const vm = ua.match(/Version\/(\d+)/);
  const safariVersion = vm ? parseInt(vm[1], 10) : 0;
  return { ios, android, inApp, chrome, samsung, safariVersion };
}

const PAGE_ICON = '<svg width="26" height="22" viewBox="0 0 26 22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="1.5" width="16" height="10" rx="3"/><path d="M4 16h18M4 20.5h18"/></svg>';

function stepsFor(d) {
  if (d.inApp) return [
    'افتح الصفحة بمتصفح الجوال: اضغط النقاط الثلاث ⋯ فوق',
    d.ios ? 'اختار "فتح في سفاري"' : 'اختار "فتح في المتصفح"',
    'واضغط "شغّل الكاشف" من هناك'
  ];
  if (d.ios && d.chrome) return [
    'افتح تطبيق الإعدادات بجوالك',
    'انزل لـ Chrome واضغطه',
    'فعّل "الكاميرا"، وارجع هنا'
  ];
  if (d.ios && d.safariVersion >= 26) return [
    { icon: PAGE_ICON, text: 'اضغط هالرمز اللي بآخر شريط الموقع' },
    'اضغط النقاط الثلاث ⋯ تحت على اليسار',
    'انزل لآخر القائمة، وفعّل "الكاميرا"'
  ];
  if (d.ios) return [
    'اضغط "aA" بشريط العنوان',
    'اختار "إعدادات موقع الويب"',
    'خلّ "الكاميرا" على "سماح"'
  ];
  if (d.android && d.samsung) return [
    'اضغط رمز القفل 🔒 جنب الرابط',
    'اختار "الأذونات"',
    'فعّل "الكاميرا"'
  ];
  if (d.android) return [
    'اضغط الرمز اللي جنب الرابط فوق',
    'اختار "الأذونات"',
    'خلّ "الكاميرا" على "سماح"'
  ];
  return [
    'اضغط رمز الكاميرا أو القفل بشريط العنوان',
    'خلّ "الكاميرا" على "سماح"',
    'وحدّث الصفحة'
  ];
}

function showGuide(title, hint, steps) {
  statusEl.textContent = title;
  hintEl.textContent = hint;
  guideEl.innerHTML = '';
  (steps || []).forEach((s, i) => {
    const li = document.createElement('li');
    const b = document.createElement('b'); b.textContent = String(i + 1);
    const span = document.createElement('span');
    if (typeof s === 'string') {
      span.textContent = s;
    } else {
      const ic = document.createElement('i');
      ic.className = 'ic'; ic.innerHTML = s.icon;
      span.append(ic, document.createTextNode(' ' + s.text));
    }
    li.append(b, span); guideEl.appendChild(li);
  });
  guideEl.hidden = !(steps && steps.length);
  startBtn.textContent = 'جرّب مرة ثانية';
  startBtn.hidden = false;
}

startBtn.addEventListener('click', async () => {
  const d = device();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showGuide('متصفحك ما يدعم الكاميرا هنا', 'افتح الصفحة بسفاري أو كروم.', d.inApp ? stepsFor(d) : []);
    return;
  }
  let stream;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
  } catch (e) {
    const n = e && e.name;
    if (n === 'NotAllowedError' || n === 'SecurityError' || n === 'PermissionDeniedError') {
      showGuide('الكاشف يحتاج إذن الكاميرا', 'عشان نفعّله، سوّ هالخطوات وبعدها اضغط "جرّب مرة ثانية":', stepsFor(d));
    } else if (n === 'NotReadableError' || n === 'TrackStartError') {
      showGuide('الكاميرا مستخدمة بتطبيق ثاني', 'سكّر أي تطبيق يستخدم الكاميرا (مثل سناب أو مكالمة فيديو)، وجرّب مرة ثانية.', []);
    } else if (n === 'NotFoundError' || n === 'OverconstrainedError') {
      showGuide('ما لقينا كاميرا بجهازك', 'جرّب من الجوال عشان تستخدم الكاميرا الخلفية.', []);
    } else {
      showGuide('ما قدرنا نفتح الكاميرا', 'جرّب مرة ثانية، ولو تكرر افتح الصفحة بسفاري أو كروم.', d.inApp ? stepsFor(d) : []);
    }
    return;
  }
  guideEl.hidden = true;
  startBtn.hidden = true;
  video.srcObject = stream;
  try { await video.play(); } catch (e) {}
  statusEl.textContent = 'نجهّز الكاشف…';
  hintEl.textContent = 'امشِ بهدوء ووجّه الكاميرا للأرض.';
  await detectorReady;
  if (window.WASMI_DETECT) {
    statusEl.textContent = 'يدوّر…';
  } else {
    statusEl.textContent = 'الكاميرا شغالة، والكاشف تحت التدريب';
    hintEl.textContent = 'نعلّم الكاشف الحين على صور الفقع تحت التراب. أول ما يجهز بيشتغل هنا مباشرة بدون أي تحديث منك.';
  }
  zoomBtn.hidden = !window.WASMI_DETECT;
  document.getElementById('trackbtn').hidden = false;
  startTracking();
  loop();
});

const zoomBtn = document.getElementById('zoom');
zoomBtn.addEventListener('click', () => {
  MODEL.zoom = !MODEL.zoom;
  MODEL.step = 0;
  zoomBtn.setAttribute('aria-pressed', String(MODEL.zoom));
  const t = MODEL.zoom ? 'scale(2)' : '';
  video.style.transform = t; canvas.style.transform = t;
});

// ---- walked-path coverage ----
const SWATH_M = 3; // ground width the camera covers while walking
const TRACK_KEY = 'wasmi-track-' + new Date().toISOString().slice(0, 10);
const TRACK = { pts: [], marks: [], watch: null, map: null, layer: null };
try { const s = JSON.parse(localStorage.getItem(TRACK_KEY) || 'null'); if (s) { TRACK.pts = s.pts || []; TRACK.marks = s.marks || []; } } catch (e) {}
function saveTrack() { try { localStorage.setItem(TRACK_KEY, JSON.stringify({ pts: TRACK.pts, marks: TRACK.marks })); } catch (e) {} }
function distM(a, b) {
  const R = 6371000, toR = Math.PI / 180;
  const dLat = (b[0] - a[0]) * toR, dLon = (b[1] - a[1]) * toR;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * toR) * Math.cos(b[0] * toR) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function totalDist() { let d = 0; for (let i = 1; i < TRACK.pts.length; i++) { const g = distM(TRACK.pts[i - 1], TRACK.pts[i]); if (g < 60) d += g; } return d; }
function startTracking() {
  if (!navigator.geolocation || TRACK.watch !== null) return;
  TRACK.watch = navigator.geolocation.watchPosition((p) => {
    if (p.coords.accuracy > 30) return;
    const pt = [p.coords.latitude, p.coords.longitude];
    const last = TRACK.pts[TRACK.pts.length - 1];
    if (!last || distM(last, pt) >= 2) { TRACK.pts.push(pt); saveTrack(); if (TRACK.map) drawTrack(); }
    TRACK.here = pt;
  }, () => { document.getElementById('tracknote').textContent = 'فعّل خدمة الموقع عشان نرسم المكان اللي مشيته.'; }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
}
let lastMark = 0;
function markSign() {
  const now = Date.now();
  if (!TRACK.here || now - lastMark < 8000) return;
  const near = TRACK.marks.some(m => distM(m, TRACK.here) < 4);
  if (near) return;
  lastMark = now; TRACK.marks.push(TRACK.here.slice()); saveTrack(); if (TRACK.map) drawTrack();
}
function loadLeaflet() {
  if (window.L) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
function drawTrack() {
  if (!TRACK.layer) return;
  TRACK.layer.clearLayers();
  let seg = [];
  const flush = () => { if (seg.length) { for (const p of seg) L.circle(p, { radius: SWATH_M / 2, stroke: false, fillColor: '#C98F3E', fillOpacity: 0.45 }).addTo(TRACK.layer); if (seg.length > 1) L.polyline(seg, { color: '#FAF3E6', weight: 2, opacity: 0.8 }).addTo(TRACK.layer); } seg = []; };
  for (let i = 0; i < TRACK.pts.length; i++) {
    if (i && distM(TRACK.pts[i - 1], TRACK.pts[i]) >= 60) flush();
    seg.push(TRACK.pts[i]);
  }
  flush();
  for (const m of TRACK.marks) L.circleMarker(m, { radius: 8, color: '#FAF3E6', weight: 2, fillColor: '#A5552E', fillOpacity: 1 }).bindTooltip('علامة فقع محتملة').addTo(TRACK.layer);
  if (TRACK.here) L.circleMarker(TRACK.here, { radius: 7, color: '#FAF3E6', weight: 3, fillColor: '#2E1C12', fillOpacity: 1 }).addTo(TRACK.layer);
  const d = totalDist();
  document.getElementById('tdist').textContent = Math.round(d).toLocaleString('ar');
  document.getElementById('tarea').textContent = Math.round(d * SWATH_M).toLocaleString('ar');
  document.getElementById('tmarks').textContent = TRACK.marks.length.toLocaleString('ar');
  if (!TRACK.pts.length && !TRACK.here) document.getElementById('tracknote').textContent = 'امشِ والكاشف شغال، وبيترسم مسارك هنا.';
  else document.getElementById('tracknote').textContent = 'الأماكن الملونة فحصها الكاشف. دوّر بالأماكن اللي ما تلونت.';
}
async function openSheet() {
  document.getElementById('sheet').hidden = false;
  try {
    await loadLeaflet();
    if (!TRACK.map) {
      TRACK.map = L.map('trackmap', { zoomControl: false, preferCanvas: true });
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, maxNativeZoom: 19, attribution: 'Esri' }).addTo(TRACK.map);
      TRACK.layer = L.layerGroup().addTo(TRACK.map);
    }
    const c = TRACK.here || TRACK.pts[TRACK.pts.length - 1];
    TRACK.map.setView(c || [27.5, 41.7], c ? 19 : 6);
    setTimeout(() => TRACK.map.invalidateSize(), 50);
    drawTrack();
  } catch (e) { document.getElementById('tracknote').textContent = 'ما قدرنا نحمّل الخريطة، تأكد من الإنترنت.'; }
}
document.getElementById('trackbtn').addEventListener('click', openSheet);
document.getElementById('sheetclose').addEventListener('click', () => { document.getElementById('sheet').hidden = true; });
document.getElementById('trackclear').addEventListener('click', () => { TRACK.pts = []; TRACK.marks = []; saveTrack(); drawTrack(); });
</script>
</body>
