<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>وسمي — نسبة الفقع حولك</title>
<meta name="description" content="وسمي: خريطة تقدّر نسبة الفقع حولك بناءً على مطر الوسم والبرق والتربة وصور الأقمار الصناعية.">
<meta name="theme-color" content="#5A331C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root {
  --sand: #FAF3E6;
  --dune: #EADBC0;
  --honey: #C98F3E;
  --clay: #A5552E;
  --earth: #5A331C;
  --ink: #2E1C12;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: "IBM Plex Sans Arabic", "Geeza Pro", Tahoma, sans-serif;
  background: var(--sand);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
#map { position: fixed; inset: 0; background: var(--dune); }
.leaflet-container { font-family: inherit; }

.top {
  position: fixed; top: 0; inset-inline: 0; z-index: 500;
  padding: calc(var(--safe-top) + 12px) 18px 12px;
  display: flex; align-items: center; justify-content: space-between;
  background: linear-gradient(to bottom, rgba(250,243,230,.96), rgba(250,243,230,0));
  pointer-events: none;
}
.word {
  font-family: "Reem Kufi", "IBM Plex Sans Arabic", sans-serif;
  font-weight: 700; font-size: 32px; line-height: 1; color: var(--earth);
  pointer-events: auto; text-decoration: none;
}
.locate {
  pointer-events: auto;
  border: 0; border-radius: 999px; padding: 10px 16px;
  background: var(--earth); color: var(--sand);
  font: 600 15px/1 inherit; font-family: inherit; cursor: pointer;
}
.locate:focus-visible, .scan:focus-visible, .soon summary:focus-visible { outline: 3px solid var(--honey); outline-offset: 2px; }

.sheet {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 600;
  background: var(--sand);
  border-radius: 22px 22px 0 0;
  box-shadow: 0 -8px 30px rgba(46,28,18,.18);
  padding: 10px 20px calc(var(--safe-bottom) + 18px);
  max-width: 560px; margin-inline: auto;
}
.grip { width: 44px; height: 5px; border-radius: 9px; background: var(--dune); margin: 0 auto 14px; }
.here { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; align-items: center; }
.pct {
  grid-row: span 2;
  font-family: "Reem Kufi", sans-serif; font-weight: 700;
  font-size: 64px; line-height: .9; color: var(--clay);
  min-width: 2.2ch; text-align: center;
}
.pct small { font-size: 26px; }
.where { font-weight: 600; font-size: 17px; margin: 0; }
.stage { margin: 0; font-size: 15px; color: var(--earth); }
.note { margin: 12px 0 0; font-size: 14px; line-height: 1.7; color: #6b5243; max-width: 60ch; }
.scan {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; margin-top: 16px; padding: 15px 18px;
  border: 0; border-radius: 14px;
  background: var(--honey); color: var(--ink);
  font: 600 17px/1 inherit; font-family: inherit; text-decoration: none;
}
.scan svg { width: 22px; height: 22px; }
.legend { display: flex; gap: 6px; align-items: center; margin-top: 14px; font-size: 12.5px; color: #6b5243; }
.legend i { width: 22px; height: 10px; border-radius: 3px; display: inline-block; }
.soon { margin-top: 14px; border-top: 1px solid var(--dune); padding-top: 10px; }
.soon summary { cursor: pointer; font-weight: 600; font-size: 15px; color: var(--earth); list-style: none; }
.soon summary::-webkit-details-marker { display: none; }
.soon ul { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.soon li { font-size: 15px; display: flex; justify-content: space-between; }
.soon li span { color: #8a6f5e; font-size: 13px; }
.updated { margin-top: 10px; font-size: 12px; color: #8a6f5e; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="map" aria-label="خريطة نسبة الفقع"></div>

<header class="top">
  <a class="word" href="./">وسمي</a>
  <button class="locate" id="locate" type="button">موقعي</button>
</header>

<section class="sheet" aria-live="polite">
  <div class="grip" aria-hidden="true"></div>
  <div class="here">
    <div class="pct" id="pct">–</div>
    <p class="where" id="where">نحدد موقعك…</p>
    <p class="stage" id="stage">اسمح للموقع يعرف مكانك عشان نعطيك نسبة الفقع حولك.</p>
  </div>
  <p class="note" id="note"></p>
  <a class="scan" href="camera.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/></svg>
    افتح كاشف الفقع
  </a>
  <div class="legend" aria-hidden="true">
    <span>ضعيفة</span>
    <i style="background:#E9C98F"></i><i style="background:#C98F3E"></i><i style="background:#A5552E"></i><i style="background:#5A331C"></i>
    <span>عالية</span>
  </div>
  <details class="soon">
    <summary>أقسام جاية قريب</summary>
    <ul>
      <li>الطقس وتوقعات المطر <span>قريباً</span></li>
      <li>تقويم مواسم البر <span>قريباً</span></li>
      <li>أخبار البر <span>قريباً</span></li>
      <li>متجر وسمي <span>قريباً</span></li>
    </ul>
  </details>
  <p class="updated" id="updated"></p>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const STAGES = ['لا مطر مفيد', 'بعد المطر - انتظار', 'قرب البداية', 'الذروة', 'متوسط', 'نهاية الموسم', 'مزرعة'];
const STAGE_NOTE = {
  0: 'ما نزل على هالمنطقة مطر مفيد هالموسم للحين. النسبة تبدأ تتحرك بعد أول مطر وسم مفيد.',
  1: 'نزل مطر مفيد، والأرض الحين بمرحلة الانتظار. الفقع يحتاج أسابيع بعد المطر.',
  2: 'قربنا من بداية طلوع الفقع بهالمنطقة.',
  3: 'هذا وقت الذروة حسب المطر والبرق وحالة الأرض.',
  4: 'الموسم ماشي، والفرصة موجودة بس أقل من الذروة.',
  5: 'الموسم قارب يخلص بهالمنطقة.',
  6: 'هالمربع أغلبه مزارع، فما نحسب له نسبة.'
};
const map = L.map('map', { zoomControl: false, preferCanvas: true, attributionControl: true }).setView([28.3, 43.5], 6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 15, attribution: '© OpenStreetMap'
}).addTo(map);

const cells = new Map();
let userMarker = null;
const key = (lat, lon) => (Math.round(lat * 10) / 10).toFixed(1) + '_' + (Math.round(lon * 10) / 10).toFixed(1);
const colorOf = (s) => s >= 70 ? '#5A331C' : s >= 45 ? '#A5552E' : s >= 20 ? '#C98F3E' : '#E9C98F';

function showHere(lat, lon) {
  const c = cells.get(key(lat, lon));
  const pct = document.getElementById('pct');
  const stage = document.getElementById('stage');
  const where = document.getElementById('where');
  const note = document.getElementById('note');
  if (!c) {
    pct.textContent = '–';
    where.textContent = 'موقعك برا منطقة التغطية';
    stage.textContent = 'نغطي الحين شمال المملكة لين خط عرض ٢٤ والشرقية.';
    note.textContent = '';
    return;
  }
  pct.innerHTML = c.s + '<small>٪</small>';
  where.textContent = 'نسبة الفقع بالمربع اللي أنت فيه';
  stage.textContent = 'المرحلة: ' + STAGES[c.g];
  note.textContent = STAGE_NOTE[c.g] || '';
}

function locate() {
  if (!navigator.geolocation) { document.getElementById('where').textContent = 'جوالك ما يدعم تحديد الموقع'; return; }
  document.getElementById('where').textContent = 'نحدد موقعك…';
  navigator.geolocation.getCurrentPosition((p) => {
    const { latitude: lat, longitude: lon } = p.coords;
    if (userMarker) userMarker.setLatLng([lat, lon]);
    else userMarker = L.circleMarker([lat, lon], { radius: 9, color: '#FAF3E6', weight: 3, fillColor: '#2E1C12', fillOpacity: 1 }).addTo(map);
    map.setView([lat, lon], 10);
    showHere(lat, lon);
  }, () => {
    document.getElementById('where').textContent = 'ما قدرنا نعرف موقعك';
    document.getElementById('stage').textContent = 'فعّل خدمة الموقع للمتصفح، أو اضغط على أي مربع بالخريطة.';
  }, { enableHighAccuracy: true, timeout: 15000 });
}

fetch('data/scores.json?v=' + Date.now()).then(r => r.json()).then((d) => {
  for (const [lat, lon, s, g] of d.cells) {
    cells.set(key(lat, lon), { s, g });
    if (s > 0) {
      L.rectangle([[lat - 0.05, lon - 0.05], [lat + 0.05, lon + 0.05]], {
        stroke: false, fillColor: colorOf(s), fillOpacity: 0.55
      }).on('click', () => showHere(lat, lon)).addTo(map);
    }
  }
  if (d.updated) document.getElementById('updated').textContent = 'آخر تحديث للنسب: ' + d.updated;
  map.on('click', (e) => showHere(e.latlng.lat, e.latlng.lng));
  locate();
}).catch(() => {
  document.getElementById('where').textContent = 'ما قدرنا نحمّل النسب';
  document.getElementById('stage').textContent = 'تأكد من الإنترنت وحدّث الصفحة.';
});
document.getElementById('locate').addEventListener('click', locate);
</script>
</body>
</html>
