<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>وسمي | تقويم مواسم البر</title>
<link rel="canonical" href="https://wasmii.com/">
<meta name="description" content="تقويم مواسم البر في السعودية: الوسم، المربعانية، الشبط، العقارب، سهيل وغيرها، مع الطوالع وتواريخ كل موسم والموسم الحالي.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--sand:#FAF3E6;--honey:#C98F3E;--terra:#A5552E;--brown:#5A331C;--line:#EADCC3;--card:#FFFDF8;--muted:#8A6A52}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--sand);color:var(--brown);font-family:'Tajawal',sans-serif;line-height:1.8}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header{padding:22px 0 8px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Reem Kufi',sans-serif;font-size:34px;font-weight:700;color:var(--brown);text-decoration:none}
.wx{font-size:14px;color:var(--terra);text-decoration:none;border:1px solid var(--terra);border-radius:999px;padding:6px 14px}
h1{font-family:'Reem Kufi',sans-serif;font-size:30px;margin:18px 0 4px}
.sub{color:var(--muted);font-size:15px}
.now{margin:22px 0;background:var(--brown);color:var(--sand);border-radius:20px;padding:24px;position:relative;overflow:hidden}
.now small{color:var(--honey);font-weight:700;font-size:14px}
.now h2{font-family:'Reem Kufi',sans-serif;font-size:40px;line-height:1.3;margin:4px 0}
.now .dates{opacity:.85;font-size:15px}
.bar{height:8px;background:rgba(250,243,230,.18);border-radius:8px;margin:16px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--honey);border-radius:8px}
.meta{display:flex;justify-content:space-between;font-size:14px;opacity:.9;flex-wrap:wrap;gap:6px}
.next{margin-top:14px;padding-top:14px;border-top:1px solid rgba(250,243,230,.2);font-size:15px}
.next b{color:var(--honey);font-size:22px}
.grid{display:grid;gap:14px;margin:8px 0 26px}
.s{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 14px}
.s.cur{border:2px solid var(--honey)}
.s .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.s h3{font-family:'Reem Kufi',sans-serif;font-size:24px}
.s .rng{font-size:14px;color:var(--terra);font-weight:700}
.tag{display:inline-block;background:var(--honey);color:#fff;font-size:12px;border-radius:999px;padding:1px 10px;margin-inline-start:6px;vertical-align:middle}
.s .st{font-size:14px;color:var(--muted);margin:2px 0 8px}
.s p{font-size:15.5px}
.s p+p{margin-top:4px}
.s p b{color:var(--terra);font-weight:700}
.note{font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);padding:16px 0 30px}
.note a{color:var(--terra)}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <a class="logo" href="/">وسمي</a>
  <a class="wx" href="https://ncm.gov.sa" target="_blank" rel="noopener">الطقس من المصدر الرسمي ↗</a>
</header>

<h1>تقويم مواسم البر</h1>
<p class="sub">مواسم السنة وطوالعها كما يعرفها أهل البر من الأولين</p>

<section class="now" id="now"></section>

<div class="grid" id="grid"></div>

<p class="note">التواريخ حسب تقويم د. عبدالله المسند، وقد تختلف بيوم أو يومين بين التقاويم. الأوصاف معلومات تراثية وليست توقعات جوية؛ للطقس والتنبيهات ارجع إلى <a href="https://ncm.gov.sa" target="_blank" rel="noopener">المركز الوطني للأرصاد</a>.</p>
</div>

<script>
const S=[
{n:"الوسم",m:10,d:16,t:"العوّاء، السماك، الغفر، الزبانا",h:"سمّوه الوسم لأنه يَسِم الأرض بالنبات، وهو عند الأولين بداية الربيع وأغلى مواسم السنة.",b:"أول طلوع النبات الحولي بالفياض والشعبان."},
{n:"المربعانية",m:12,d:7,t:"الإكليل، القلب، الشولة",h:"أربعين يوم، ويسمونها «البرد القارس»، وفيها أطول ليلة بالسنة.",b:"موسم الشبّة وسوالف الليل عند أهل البر."},
{n:"الشبط",m:1,d:16,t:"النعائم، البلدة",h:"ثاني مواسم الشتاء، ويقول الأولين «الشبط يشبط».",b:"يقرب فيه موسم النفل والخزامى."},
{n:"العقارب",m:2,d:11,t:"سعد الذابح، سعد بلع، سعد السعود",h:"آخر مواسم الشتاء، ويقسمونها: عقرب السم، وعقرب الدم، وعقرب الدسم.",b:"ذروة الربيع، وأزهى أيام البر بالنوار."},
{n:"الحميمين",m:3,d:22,t:"سعد الأخبية، المقدّم",h:"سمّوه الحميمين لأن الدفا يبدأ فيه.",b:"آخر أيام الكشتات الربيعية، والنبات يبدأ يكتمل."},
{n:"الذراعين",m:4,d:17,t:"المؤخّر، الرشا",h:"نهاية الربيع عند الأولين.",b:"يبدأ النبات الحولي يصفر ويبذر."},
{n:"الثريا",m:5,d:13,t:"الشرطين، البطين، الثريا",h:"أول مواسم القيظ، ويختفي فيه نجم الثريا ثم يطلع فجراً.",b:"موسم ترك البر والرجوع للمورد والظل."},
{n:"التويبع",m:6,d:21,t:"الدبران",h:"سمّوه التويبع لأنه يتبع الثريا، وفيه أطول نهار بالسنة.",b:""},
{n:"الجوزاء",m:7,d:4,t:"الهقعة، الهنعة (الجوزاء الأولى والثانية)",h:"قلب القيظ، وفيه يقولون «إذا طلعت الجوزاء توقدت المعزاء».",b:"موسم صرام النخل يبدأ."},
{n:"المرزم",m:7,d:30,t:"الذراع",h:"يسمونه «مرزم الجوزاء»، ومن أشد أيام القيظ عند الأولين.",b:""},
{n:"الكليبين",m:8,d:12,t:"النثرة",h:"سمّوه الكليبين لأن الكلاب تلهث فيه من شدة القيظ، وهو آخر أيام القيظ.",b:""},
{n:"سهيل",m:8,d:24,t:"الطرف، الجبهة، الزبرة، الصرفة",h:"«إذا طلع سهيل لا تأمن السيل»، ويبدأ عنده انكسار القيظ، وهو بداية السنة السهيلية.",b:"يبدأ أهل البر يتجهزون للطلعات."}
];
const MS=86400000,AR=n=>n.toLocaleString('ar-SA');
const today=new Date();today.setHours(0,0,0,0);
const gF=new Intl.DateTimeFormat('ar-SA-u-ca-gregory',{day:'numeric',month:'long'});
let hF;try{hF=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'long'})}catch(e){hF=null}
// build this cycle's absolute dates around today
function startOf(i,y){return new Date(y,S[i].m-1,S[i].d)}
let cur=-1,cs=null;
for(let k=-1;k<=0&&cur<0;k++){}
// find most recent season start <= today
let best=null;
for(let i=0;i<S.length;i++){for(const y of [today.getFullYear()-1,today.getFullYear()]){const d=startOf(i,y);if(d<=today&&(!best||d>best.d))best={i,d}}}
cur=best.i;cs=best.d;
const nx=(cur+1)%S.length;
let ns=startOf(nx,cs.getFullYear());if(ns<=cs)ns=startOf(nx,cs.getFullYear()+1);
const len=Math.round((ns-cs)/MS),day=Math.round((today-cs)/MS)+1,left=Math.round((ns-today)/MS);
const end=new Date(ns-MS);
const hij=d=>hF?' · '+hF.format(d):'';
document.getElementById('now').innerHTML=
`<small>الموسم الحالي</small><h2>${S[cur].n}</h2>
<div class="dates">${gF.format(cs)} – ${gF.format(end)}${hij(cs)}</div>
<div class="bar"><i style="width:${Math.round(day/len*100)}%"></i></div>
<div class="meta"><span>اليوم ${AR(day)} من ${AR(len)}</span><span>الطوالع: ${S[cur].t}</span></div>
<div class="next">باقي على <strong>${S[nx].n}</strong> <b>${AR(left)}</b> ${left<=10&&left>2?'أيام':'يوم'}</div>`;
// cards starting from current season
let html='';
for(let k=0;k<S.length;k++){
  const i=(cur+k)%S.length,s=S[i],j=(i+1)%S.length;
  const a=new Date(2027,s.m-1,s.d);let b=new Date(2027,S[j].m-1,S[j].d);if(b<=a)b=new Date(2028,S[j].m-1,S[j].d);
  const L=Math.round((b-a)/MS),e=new Date(b-MS);
  html+=`<article class="s${k===0?' cur':''}"><div class="top"><h3>${s.n}${k===0?'<span class="tag">الحين</span>':''}</h3><span class="rng">${gF.format(a)} – ${gF.format(e)}</span></div>
<div class="st">${AR(L)} يوم · الطوالع: ${s.t}</div>
<p><b>من التراث:</b> ${s.h}</p>${s.b?`<p><b>بالبر:</b> ${s.b}</p>`:''}</article>`;
}
document.getElementById('grid').innerHTML=html;
</script>
</body>
</html>
