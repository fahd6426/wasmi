<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>وسمت أرضك؟ 🌱 نسبة الربيع حولك | وسمي</title>
<meta name="description" content="وسمت أرضك؟ شيك على نسبة الربيع حولك من صور الأقمار الصناعية، وقارنها بالأسبوع اللي فات، وشف أقرب الأماكن اللي ربّعت.">
<link rel="canonical" href="https://wasmii.com/green.html">
<meta name="theme-color" content="#1a0d06">
<meta property="og:type" content="website"><meta property="og:locale" content="ar_SA">
<meta property="og:title" content="وسمت أرضك؟ 🌱 نسبة الربيع حولك">

<link rel="icon" href="/assets/logo/wasmi-app-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--sand:#FAF3E6;--honey:#C98F3E;--dark:#1a0d06;--card:rgba(255,255,255,.08);--line:rgba(250,243,230,.12);--mut:rgba(250,243,230,.6)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--dark);color:var(--sand);font-family:'Tajawal',system-ui,sans-serif;line-height:1.6;min-height:100vh}
a{color:inherit;text-decoration:none}
.gtop{display:flex;align-items:center;justify-content:space-between;gap:10px;height:54px;padding:0 16px;padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line)}
.gtop .logo{font-family:'Reem Kufi';font-size:24px}.gtop h1{font-size:17px;font-weight:800;color:var(--honey)}.gtop .sm{font-size:13.5px;font-weight:700;color:var(--mut)}
.body{max-width:560px;margin:0 auto;padding:18px 16px 40px}
.ttl{font-size:26px;font-weight:800;margin:6px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 18px;margin-bottom:12px}
.card h3{font-size:18px;font-weight:800;margin:6px 0 2px}.card p{font-size:15px;color:rgba(250,243,230,.85)}
.card.hero{background:linear-gradient(135deg,#2a3a12,#4d6a1f 60%,#6f8f35);border:0;padding:20px}
.card.hero small{font-size:14px;color:#e6f5c8;font-weight:700}.card.hero p{margin-top:6px}
.when{display:inline-block;font-size:13px;font-weight:800;padding:3px 12px;border-radius:30px}
.b{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;font-family:inherit;font-weight:800;cursor:pointer;padding:14px;font-size:17px;margin-top:10px}
.b1{background:var(--honey);color:#fff}.b2{background:var(--card);color:var(--sand);border:1px solid var(--line);font-size:15px;padding:11px}
.note{font-size:13px;color:var(--mut);margin-top:14px;text-align:center}
.guide{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px;text-align:right}
.guide li{display:flex;gap:10px;align-items:flex-start;background:rgba(250,243,230,.08);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.6}
.guide b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--honey);color:#fff;display:grid;place-items:center;font-size:13px}
.guide .ic{display:inline-flex;vertical-align:middle}
.gbox{display:none;background:rgba(201,143,62,.1);border:1px solid rgba(201,143,62,.35);border-radius:20px;padding:14px 16px;margin-top:12px}
.gbox.on{display:block}.gbox h3{font-size:17px;color:var(--honey)}.gbox p{font-size:14.5px;color:rgba(250,243,230,.85)}
</style>
</head>
<body>
<header class="gtop"><a class="logo" href="/">وسمي</a><h1>وسمت أرضك؟ 🌱</h1><a class="sm" href="/">الرئيسية ‹</a></header>
<main class="body">

    
    <style>#gRes .big{font-family:Tajawal,sans-serif;font-weight:800}</style><div class="card hero" id="gRes"><small>الأرض حولك</small><div class="big" style="font-size:28px">🌱 شيك على أرضك</div><p>نقارن اخضرار الأرض حولك الحين باخضرارها قبل الوسم، من صور الأقمار الصناعية.</p></div>
    <button class="b b1" id="gBtn" onclick="greenLoc()">📍 شيك على أرضي</button>
    <div class="gbox" id="vG"><h3 id="vGt"></h3><p id="vGp"></p><ol class="guide" id="vGl"></ol></div>
    <div class="ttl" style="font-size:22px;margin-top:22px">وين الربيع؟ 🗺️</div>
    <p style="font-size:14px;color:var(--mut);margin:-8px 0 10px" id="gSub">أكثر الأماكن اللي ربّعت هالموسم</p>
    <div id="gList"></div>
    <div class="note" id="gNote"></div>
  
</main>
<script>
var A=function(n){return String(n).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d]})};
var dF=new Intl.DateTimeFormat('ar-SA-u-ca-gregory',{day:'numeric',month:'long'});
var PAGE_ICON='<svg width="24" height="20" viewBox="0 0 26 22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="1.5" width="16" height="10" rx="3"/><path d="M4 16h18M4 20.5h18"/></svg>';
function OPEN_SAFARI(d){return ['افتح الرابط بمتصفح الجوال: اضغط النقاط الثلاث ⋯ أو زر المشاركة',d.ios?'اختار «فتح في سفاري»':'اختار «فتح في المتصفح»','افتح البرنامج من هناك واضغط «سماح»']}
var DN=['شمال','شمال شرق','شرق','جنوب شرق','جنوب','جنوب غرب','غرب','شمال غرب'];function dname(d){return DN[Math.round(d/45)%8]}
function device(){var ua=navigator.userAgent,vm=ua.match(/Version\/(\d+)/);return {ios:/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),android:/Android/.test(ua),
 inApp:/Instagram|FBAN|FBAV|Snapchat|Twitter|TikTok|musical_ly|Line\/|WhatsApp|Claude/i.test(ua),chrome:/CriOS|Chrome/.test(ua)&&!/Edg|SamsungBrowser|OPR/.test(ua),samsung:/SamsungBrowser/.test(ua),sv:vm?parseInt(vm[1],10):0}}
function locSteps(d){if(d.inApp)return OPEN_SAFARI(d);
 if(d.ios&&d.chrome)return ['افتح تطبيق الإعدادات بجوالك','انزل لـ Chrome واضغطه','خلّ «الموقع» على «أثناء الاستخدام»، وارجع هنا'];
 if(d.ios&&d.sv>=26)return [{icon:PAGE_ICON,text:'اضغط هالرمز اللي بآخر شريط الموقع'},'اضغط النقاط الثلاث ⋯ تحت على اليسار','فعّل «الموقع»','وإذا ما ضبط: الإعدادات ← الخصوصية والأمان ← خدمات الموقع ← مواقع Safari ← «أثناء الاستخدام»'];
 if(d.ios)return ['اضغط «aA» بشريط العنوان','اختار «إعدادات موقع الويب»','خلّ «الموقع» على «سماح»','وإذا ما ضبط: الإعدادات ← الخصوصية والأمان ← خدمات الموقع ← مواقع Safari ← «أثناء الاستخدام»'];
 if(d.android&&d.samsung)return ['اضغط رمز القفل 🔒 جنب الرابط','اختار «الأذونات»','فعّل «الموقع»'];
 if(d.android)return ['اضغط الرمز اللي جنب الرابط فوق','اختار «الأذونات»','خلّ «الموقع» على «سماح»','وتأكد إن الموقع (GPS) شغال من الإشعارات فوق'];
 return ['اضغط رمز القفل بشريط العنوان','خلّ «الموقع» على «سماح»','وحدّث الصفحة']}
function guide(px,title,hint,steps){var g=document.getElementById(px+'G');document.getElementById(px+'Gt').textContent=title;document.getElementById(px+'Gp').textContent=hint;
 var ol=document.getElementById(px+'Gl');ol.innerHTML='';(steps||[]).forEach(function(s,i){var li=document.createElement('li'),b=document.createElement('b'),sp=document.createElement('span');b.textContent=A(i+1);
  if(typeof s==='string')sp.textContent=s;else{var ic=document.createElement('i');ic.className='ic';ic.innerHTML=s.icon;sp.append(ic,document.createTextNode(' '+s.text))}li.append(b,sp);ol.appendChild(li)});g.classList.add('on')}
function unguide(px){document.getElementById(px+'G').classList.remove('on')}

/* ================= وسمت أرضك؟ ================= */
var GREEN=null,gPos=null;
var TOWNS=[['حائل',27.52,41.69],['سكاكا',29.97,40.21],['عرعر',30.98,41.02],['تبوك',28.38,36.57],['تيماء',27.63,38.55],['العلا',26.62,37.92],['بريدة',26.33,43.97],['عنيزة',26.08,43.99],['الرس',25.87,43.5],['حفر الباطن',28.43,45.96],['رفحاء',29.63,43.5],['طريف',31.67,38.65],['القريات',31.33,37.34],['دومة الجندل',29.81,39.87],['طبرجل',30.5,38.22],['سميراء',26.51,42.11],['بقعاء',27.89,42.4],['الشنان',27.18,42.44],['الغزالة',26.8,41.33],['موقق',27.39,41.18],['جبة',28.02,40.92],['العويقيلة',30.34,42.25],['الزلفي',26.3,44.8],['المجمعة',25.9,45.34],['الأرطاوية',26.5,45.35],['الرياض',24.71,46.68],['القيصومة',28.31,46.13],['النعيرية',27.47,48.48],['الجبيل',27.0,49.66],['الهفوف',25.38,49.59],['الدمام',26.43,50.1],['المدينة',24.47,39.61],['خيبر',25.7,39.29],['الوجه',26.24,36.45],['ضباء',27.35,35.69],['حقل',29.29,34.94],['الحديثة',31.46,37.13]];
function km(a,b,c,d){var R=6371,t=Math.PI/180,x=Math.sin((c-a)*t/2),y=Math.sin((d-b)*t/2),h=x*x+Math.cos(a*t)*Math.cos(c*t)*y*y;return 2*R*Math.asin(Math.sqrt(h))}
function dir8(a,b,c,d){var t=Math.PI/180,y=Math.sin((d-b)*t)*Math.cos(c*t),x=Math.cos(a*t)*Math.sin(c*t)-Math.sin(a*t)*Math.cos(c*t)*Math.cos((d-b)*t);return DN[Math.round(((Math.atan2(y,x)/t+360)%360)/45)%8]}
function nearTown(la,lo){var b=null,bd=1e9;TOWNS.forEach(function(t){var d=km(la,lo,t[1],t[2]);if(d<bd){bd=d;b=t}});return {n:b[0],d:Math.round(bd),dir:dir8(b[1],b[2],la,lo)}}
function lvl(g){return g>=35?['وسمت زين 🌿','#5fbf6a']:g>=15?['بدأت تخضر 🌱','#a9c65a']:g>=4?['ربعت على خفيف 🌾','#d9b26a']:['للحين ما بان شي 🏜️','#b9a58a']}
function cellsArr(){return (GREEN&&GREEN.cells||[]).map(function(c){return {la:c[0]/10,lo:c[1]/10,g:c[2],cur:c[3],pv:c.length>4?c[4]:-1}})}
function clusters(arr){var s=arr.filter(function(c){return c.g>=4}).sort(function(a,b){return b.g-a.g}),out=[];s.forEach(function(c){if(!out.some(function(o){return km(o.la,o.lo,c.la,c.lo)<35}))out.push(c)});return out}
function pctA(n){return A(Math.round(n))+'٪'}
function cmpTxt(c){if(!GREEN.prev||c.pv<0)return '';var d=c.g-c.pv;return d>=3?'<b style="color:#5fbf6a">↑ زادت</b> من '+pctA(c.pv)+' الأسبوع اللي فات':d<=-3?'<b style="color:#e8846b">↓ نقصت</b> من '+pctA(c.pv)+' الأسبوع اللي فات':'نفس الأسبوع اللي فات تقريباً ('+pctA(c.pv)+')'}
function renderGreen(){if(!GREEN){document.getElementById('gList').innerHTML='<p style="color:var(--mut)">ما قدرنا نحمّل بيانات الربيع الحين.</p>';return}
 var cl=clusters(cellsArr());if(gPos){cl=cl.filter(function(c){c.dk=km(gPos.la,gPos.lo,c.la,c.lo);return c.dk<=400}).sort(function(a,b){return (a.dk/60-a.g/12)-(b.dk/60-b.g/12)});document.getElementById('gSub').textContent='أقرب الأماكن اللي ربّعت حولك (لين ٤٠٠ كم)'}
 cl=cl.slice(0,8);
 document.getElementById('gList').innerHTML=cl.length?cl.map(function(c){var t=nearTown(c.la,c.lo),L=lvl(c.g),cm=cmpTxt(c);
  return '<div class="card"><span class="when" style="background:'+L[1]+'33;color:'+L[1]+'">'+L[0]+'</span><h3>'+(t.d<15?'قرب '+t.n:t.dir+' '+t.n+' بـ'+A(t.d)+' كم')+'</h3><p>نسبة الربيع <b>'+pctA(c.g)+'</b>'+(gPos?' · يبعد عنك '+A(Math.round(c.dk))+' كم':'')+(cm?'<br>'+cm:'')+'</p><a class="b b2" href="https://maps.google.com/?q='+c.la.toFixed(2)+','+c.lo.toFixed(2)+'" target="_blank" rel="noopener">افتح بالخرائط</a></div>'}).join(''):'<p style="color:var(--mut)">للحين ما فيه أماكن ربّعت'+(gPos?' قريب منك':'')+'.</p>';
 document.getElementById('gNote').textContent='نسبة الربيع = كم من الأرض (بمربع ١١ كم تقريباً) اخضرت عن قبل الموسم، من صور الأقمار الصناعية، والمزارع مستبعدة. نحدّثها مرتين بالأسبوع'+(GREEN.updated?' · آخر قياس '+dF.format(new Date(GREEN.updated)):'')}
function greenAt(la,lo){var b=GREEN.bbox;if(la<b[0]-.1||la>b[2]+.1||lo<b[1]-.1||lo>b[3]+.1)return {out:true};
 var arr=cellsArr(),own=null,best=null,bd=1e9,kl=Math.round(la*10),ko=Math.round(lo*10);arr.forEach(function(c){if(Math.round(c.la*10)===kl&&Math.round(c.lo*10)===ko)own=c;if(c.g>=4){var d=km(la,lo,c.la,c.lo);if(d<bd){bd=d;best=c}}});
 return {own:own||{la:kl/10,lo:ko/10,g:0,pv:-1},near:best,d:bd}}
function greenLoc(){var b=document.getElementById('gBtn');b.textContent='جاري تحديد موقعك…';if(!navigator.geolocation){b.textContent='جرّب مرة ثانية';guide('v','متصفحك ما يدعم الموقع هنا','افتح الصفحة بسفاري أو كروم:',OPEN_SAFARI(device()));return}
 navigator.geolocation.getCurrentPosition(function(p){unguide('v');b.textContent='📍 حدّث';gPos={la:p.coords.latitude,lo:p.coords.longitude};var r=GREEN?greenAt(gPos.la,gPos.lo):null,h=document.getElementById('gRes'),t=nearTown(gPos.la,gPos.lo);
  var where=t.d<15?'حولك قرب '+t.n:'حولك ('+t.dir+' '+t.n+')';
  if(!r)h.innerHTML='<small>الأرض حولك</small><div class="big" style="font-size:26px">ما وصلتنا البيانات</div><p>جرّب بعد شوي.</p>';
  else if(r.out)h.innerHTML='<small>الأرض حولك</small><div class="big" style="font-size:24px">منطقتك برا تغطيتنا</div><p>نغطي الحين من خط ٢٤ لين حدود الشمال، ومن البحر الأحمر لين الخليج.</p>';
  else{var c=r.own,L=lvl(c.g),cm=cmpTxt(c);
   var nb=(c.g<4&&r.near&&r.d<=60)?'<p>أقرب أرض ربّعت على بعد '+A(Math.round(r.d))+' كم ('+dir8(gPos.la,gPos.lo,r.near.la,r.near.lo)+' منك) ونسبتها '+pctA(r.near.g)+'.</p><a class="b b2" href="https://maps.google.com/?q='+r.near.la.toFixed(2)+','+r.near.lo.toFixed(2)+'" target="_blank" rel="noopener">افتحها بالخرائط</a>':'';
   h.innerHTML='<small>الأرض '+where+'</small><div class="big" style="font-size:30px;color:'+L[1]+'">'+L[0]+'</div><p style="font-size:17px">نسبة الربيع حولك: <b style="color:'+L[1]+';font-size:22px">'+pctA(c.g)+'</b></p>'+(cm?'<p>'+cm+'</p>':'')+'<p style="font-size:13px;color:var(--mut)">ارجع الأسبوع الجاي وقارن، نحدّث النسبة مرتين بالأسبوع.</p>'+nb}
  renderGreen()},
 function(err){b.textContent='جرّب مرة ثانية';guide('v',err&&err.code===1?'نحتاج إذن الموقع':'ما وصلنا موقعك',err&&err.code===1?'عشان نشوف أرضك، سوّ هالخطوات وبعدها اضغط «جرّب مرة ثانية»:':'تأكد إن الموقع (GPS) شغال، وإذا تكرر:',locSteps(device()))},{enableHighAccuracy:false,timeout:20000,maximumAge:600000})}
var greenFetched=false;
function loadGreen(){renderGreen();if(greenFetched)return;greenFetched=true;fetch('https://wasmii.com/data/green.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(j){if(j&&j.cells){GREEN=j;renderGreen()}}).catch(function(){})}

loadGreen();
</script>
</body>
</html>
