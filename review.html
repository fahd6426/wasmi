<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>وسمي — مراجعة الكاشف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --sand:#FAF3E6; --dune:#EADBC0; --honey:#C98F3E; --clay:#A5552E; --earth:#5A331C; --ink:#2E1C12; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--sand); color: var(--ink); font-family: "IBM Plex Sans Arabic", Tahoma, sans-serif; }
header { display: flex; justify-content: space-between; align-items: center; padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 10px; }
.word { font-family: "Reem Kufi", sans-serif; font-size: 28px; color: var(--earth); }
#count { font-size: 14px; color: #6b5243; }
main { max-width: 560px; margin: 0 auto; padding: 0 14px calc(env(safe-area-inset-bottom, 0px) + 20px); }
.frame { position: relative; border-radius: 16px; overflow: hidden; background: var(--dune); }
.frame img { display: block; width: 100%; height: auto; }
.frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.meta { margin: 14px 2px 0; }
.kind { display: inline-block; padding: 4px 12px; border-radius: 999px; background: var(--earth); color: var(--sand); font-size: 14px; font-weight: 600; }
.note { margin: 10px 0 0; font-size: 16px; line-height: 1.7; }
.q { margin: 14px 0 0; font-size: 15px; color: #6b5243; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.actions button { min-height: 58px; border: 0; border-radius: 14px; font: 600 18px "IBM Plex Sans Arabic", sans-serif; cursor: pointer; }
.yes { background: #3f6b3a; color: #fff; }
.no { background: var(--clay); color: #fff; }
.actions button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.done { text-align: center; padding: 60px 10px; font-size: 18px; line-height: 1.8; }
</style>
</head>
<body>
<header><span class="word">وسمي</span><span id="count"></span></header>
<main id="app"><p class="done">نحمّل الصور…</p></main>
<script>
const API = 'https://enormous-anteater.pikapod.net/webhook/';
const K = new URLSearchParams(location.search).get('k') || '';
const KIND = { crack_mound: 'أرض متفطرة', exposed: 'فقعة مكشوفة', harvested: 'فقعة محصودة', none: 'ما فيها شي' };
const app = document.getElementById('app');
const count = document.getElementById('count');
let items = [], i = 0;

function question(it) {
  if (it.kind === 'crack_mound' || it.kind === 'exposed') return 'هل المربع على علامة فقع صحيحة، ومو كبير زيادة؟';
  if (it.kind === 'harvested') return 'هل هذي فعلاً فقعة مطلّعة (باليد أو مقطوعة)؟';
  return 'هل فعلاً ما فيها أي علامة فقع؟';
}

function draw(img, canvas, boxes) {
  canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
  const ctx = canvas.getContext('2d');
  ctx.lineWidth = Math.max(4, img.naturalWidth / 120);
  ctx.strokeStyle = '#FFD24A';
  for (const b of boxes) {
    const [y0, x0, y1, x1] = b.map(v => v / 1000);
    ctx.strokeRect(x0 * canvas.width, y0 * canvas.height, (x1 - x0) * canvas.width, (y1 - y0) * canvas.height);
  }
}

function show() {
  count.textContent = items.length ? `باقي ${items.length - i} من ${items.length}` : '';
  if (i >= items.length) {
    app.innerHTML = '<p class="done">خلصت المراجعة 👍<br>شكراً، الكاشف بيتعلم من اختياراتك.</p>';
    return;
  }
  const it = items[i];
  let boxes = []; try { boxes = JSON.parse(it.boxes || '[]'); } catch (e) {}
  app.innerHTML = `
    <div class="frame"><img alt="لقطة للمراجعة"><canvas aria-hidden="true"></canvas></div>
    <div class="meta">
      <span class="kind">${KIND[it.kind] || it.kind}</span>
      <p class="note"></p>
      <p class="q">${question(it)}</p>
    </div>
    <div class="actions">
      <button class="yes" type="button">✓ صح</button>
      <button class="no" type="button">✗ غلط</button>
    </div>`;
  app.querySelector('.note').textContent = it.note || '';
  const img = app.querySelector('img');
  const canvas = app.querySelector('canvas');
  img.onload = () => draw(img, canvas, boxes);
  img.src = API + 'wasmi-review-img?k=' + encodeURIComponent(K) + '&path=' + encodeURIComponent(it.path);
  app.querySelector('.yes').onclick = () => decide(it, 'yes');
  app.querySelector('.no').onclick = () => decide(it, 'no');
}

function decide(it, decision) {
  fetch(API + 'wasmi-review-save?k=' + encodeURIComponent(K), {
    method: 'POST',
    body: new URLSearchParams({ path: it.path, decision })
  }).catch(() => {});
  i += 1;
  show();
}

fetch(API + 'wasmi-review-list?k=' + encodeURIComponent(K), { cache: 'no-store' })
  .then(r => r.json())
  .then(d => {
    if (d.error) { app.innerHTML = '<p class="done">الرابط غير صحيح.</p>'; return; }
    items = d.items || [];
    if (!items.length) { app.innerHTML = `<p class="done">ما فيه صور تحتاج مراجعة 👍<br>انقبل تلقائياً ${d.auto} من ${d.total}.</p>`; return; }
    show();
  })
  .catch(() => { app.innerHTML = '<p class="done">ما قدرنا نحمّل الصور، جرّب بعد شوي.</p>'; });
</script>
</body>
</html>
