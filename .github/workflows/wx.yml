name: wasmi-weather

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wasmi-weather
  cancel-in-progress: false

jobs:
  weather:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python tools/wx.py
        env:
          PYTHONUNBUFFERED: "1"
      - run: |
          git config user.name "wasmi-bot"
          git config user.email "wasmi-bot@users.noreply.github.com"
          git add data/wx
          git commit -m "weather forecast update" || echo "nothing to commit"
          git pull --rebase -X ours || true
          git push
