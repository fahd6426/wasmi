name: build-logo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install uharfbuzz fonttools cairosvg
      - run: python tools/logo.py
      - run: |
          git config user.name "wasmi-bot"
          git config user.email "wasmi-bot@users.noreply.github.com"
          git add assets/logo
          git commit -m "build logo files" || echo "nothing to commit"
          git push
